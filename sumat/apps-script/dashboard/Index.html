<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF; --ink: #0A0A0A;
    --grey-50: #FAFAFA; --grey-100: #F3F3F1; --grey-300: #D6D6D3; --grey-600: #6B6B68;
    --sunrise: linear-gradient(180deg, #FFE400 0%, #FFC700 100%);
    --error: #B42318;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--grey-50); color: var(--ink); font-family: "Helvetica Now Display", Inter, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 2; background: var(--white); border-bottom: 1px solid var(--grey-300); }
  .bar { max-width: 880px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .bar svg { width: 18px; height: 29px; flex: none; }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .bar .viewer { margin-left: auto; font-size: 13px; color: var(--grey-600); }
  .refresh { border: 1px solid var(--grey-300); background: var(--white); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }

  main { max-width: 880px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { border: 1px solid var(--grey-300); background: var(--white); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .tab .n { font-weight: 500; color: var(--grey-600); }
  .tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--white); }
  .tab[aria-pressed="true"] .n { color: var(--grey-300); }
  .search { margin-left: auto; min-width: 220px; flex: 1; max-width: 320px; padding: 9px 14px; border: 1px solid var(--grey-300); border-radius: 999px; background: var(--white); font-size: 14px; }

  .item { background: var(--white); border: 1px solid var(--grey-300); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .item.is-new { border-color: var(--ink); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--grey-600); }
  .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--grey-100); color: var(--ink); }
  .badge.named { background: var(--sunrise); border: 1px solid var(--ink); }
  .who { color: var(--ink); font-weight: 600; }
  .msg { margin: 0; font-size: 17px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .prompt { margin: 0; font-size: 13px; color: var(--grey-600); }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--grey-100); padding-top: 14px; }
  .status { display: flex; gap: 4px; padding: 3px; background: var(--grey-100); border: 1px solid var(--grey-300); border-radius: 999px; }
  .status button { border: 0; background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--grey-600); cursor: pointer; }
  .status button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .copy { border: 0; background: none; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .notes { display: flex; flex-direction: column; gap: 6px; }
  .notes textarea { width: 100%; min-height: 44px; resize: vertical; padding: 10px 12px; font-size: 14px; border: 1px solid var(--grey-300); border-radius: 12px; background: var(--grey-50); }
  .saved { font-size: 12px; color: var(--grey-600); min-height: 16px; }

  .state { text-align: center; padding: 56px 20px; color: var(--grey-600); font-size: 15px; line-height: 1.5; }
  .state b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
  .state.error b { color: var(--error); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg viewBox="0 0 1015 1630" aria-hidden="true">
      <defs><linearGradient id="t" x1="600" y1="0" x2="300" y2="1400" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE400"/><stop offset="1" stop-color="#FFC700"/></linearGradient></defs>
      <path d="M135 600 L880 75 L608 1455 L298 1625 Z" fill="#E6E6E6"/>
      <path d="M193 235 L392 62 L408 75 L500 0 L492 345 L373 430 L380 632 L268 695 Z" fill="url(#t)" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
      <path d="M497 205 L655 230 L492 345 Z" fill="url(#t)" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
      <path d="M268 695 L380 632 L373 430 L660 230 L558 745 L640 770 L510 1350 L427 1402 L415 1288 L385 1332 L380 1308 L367 1325 Z" fill="url(#t)" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
    </svg>
    <h1>Sumat inbox</h1>
    <span class="viewer" id="viewer"></span>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </div>
</header>

<main>
  <div class="tools">
    <div class="tabs" id="tabs" role="group" aria-label="Filter by status"></div>
    <input class="search" id="search" type="search" placeholder="Search messages, names, notes" aria-label="Search messages">
  </div>
  <div id="list" aria-live="polite"><p class="state"><b>Loading messages…</b></p></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const call = (fn, ...args) => new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));

  let data = { items: [], statuses: [] };
  let filter = 'New';
  let query = '';

  const fmt = new Intl.DateTimeFormat('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  function when(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const mins = Math.round((Date.now() - d) / 60000);
    const ago = mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : mins < 1440 ? Math.round(mins / 60) + ' h ago' : null;
    return ago ? ago + ' (' + fmt.format(d) + ')' : fmt.format(d);
  }

  function renderTabs() {
    const tabs = $('tabs');
    tabs.replaceChildren();
    ['New', 'Shortlisted', 'Published', 'Archived', 'All'].forEach((s) => {
      const n = s === 'All' ? data.items.length : data.items.filter((x) => x.status === s).length;
      const b = el('button', 'tab');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(filter === s));
      b.append(el('span', null, s), el('span', 'n', String(n)));
      b.onclick = () => { filter = s; render(); };
      tabs.append(b);
    });
  }

  function renderItem(item) {
    const card = el('article', 'item' + (item.status === 'New' ? ' is-new' : ''));

    const meta = el('div', 'meta');
    meta.append(el('span', 'badge' + (item.sentAs === 'With name' ? ' named' : ''), item.sentAs || 'Anonymous'));
    if (item.name) meta.append(el('span', 'who', item.name + (item.course ? ', ' + item.course : '')));
    meta.append(el('span', null, when(item.received)));
    card.append(meta, el('p', 'msg', item.message));
    if (item.prompt) card.append(el('p', 'prompt', 'Prompt: ' + item.prompt));

    const row = el('div', 'row');
    const status = el('div', 'status');
    status.setAttribute('role', 'group');
    status.setAttribute('aria-label', 'Status');
    data.statuses.forEach((s) => {
      const b = el('button', null, s);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(item.status === s));
      b.onclick = async () => {
        const before = item.status;
        item.status = s;
        render();
        try { await call('updateSubmission', item.id, { status: s }); }
        catch (err) { item.status = before; render(); alert('Status not saved: ' + err.message); }
      };
      status.append(b);
    });
    const copy = el('button', 'copy', 'Copy text');
    copy.type = 'button';
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(item.message); copy.textContent = 'Copied'; }
      catch { copy.textContent = 'Copy failed'; }
      setTimeout(() => (copy.textContent = 'Copy text'), 1500);
    };
    row.append(status, copy);

    const notes = el('label', 'notes');
    const ta = el('textarea');
    ta.value = item.notes;
    ta.placeholder = 'Editor notes (only editors see these)';
    ta.setAttribute('aria-label', 'Editor notes');
    const saved = el('span', 'saved');
    ta.onblur = async () => {
      if (ta.value === item.notes) return;
      saved.textContent = 'Saving…';
      try { await call('updateSubmission', item.id, { notes: ta.value }); item.notes = ta.value; saved.textContent = 'Saved'; }
      catch (err) { saved.textContent = 'Not saved: ' + err.message; }
    };
    notes.append(ta, saved);

    card.append(row, notes);
    return card;
  }

  function render() {
    renderTabs();
    const q = query.toLowerCase();
    const items = data.items.filter((x) =>
      (filter === 'All' || x.status === filter) &&
      (!q || [x.message, x.name, x.course, x.notes, x.prompt].join(' ').toLowerCase().includes(q))
    );
    const list = $('list');
    list.replaceChildren();
    if (!items.length) {
      const empty = el('p', 'state');
      empty.append(el('b', null, q ? 'No messages match that search.' : 'No ' + (filter === 'All' ? '' : filter.toLowerCase() + ' ') + 'messages.'));
      empty.append(document.createTextNode(filter === 'New' && !q ? 'New messages from Sumat show up here.' : 'Try another filter.'));
      list.append(empty);
      return;
    }
    const wrap = el('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:12px';
    items.forEach((x) => wrap.append(renderItem(x)));
    list.append(wrap);
  }

  async function load() {
    $('refresh').disabled = true;
    try {
      data = await call('getSubmissions');
      $('viewer').textContent = data.viewer || '';
      render();
    } catch (err) {
      const box = el('div', 'state error');
      box.append(el('b', null, "You can't open the Sumat inbox."), document.createTextNode('Ask the editor-in-chief to share the Sumat Inbox spreadsheet with your LNU account, then reload this page.'));
      $('list').replaceChildren(box);
    } finally {
      $('refresh').disabled = false;
    }
  }

  $('refresh').onclick = load;
  $('search').oninput = (e) => { query = e.target.value; render(); };
  setInterval(() => { if (document.visibilityState === 'visible' && !document.activeElement.matches('textarea')) load(); }, 60000);
  load();
</script>
</body>
</html>
